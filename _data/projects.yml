# 学术 / 竞赛项目
- period: 2021.09 — 2024.06
  fund: 国家自然科学基金
  title: 脑网络功能可控性分析与建模
  role: 参与人 · 医学影像分析
  desc: >-
    探索大脑网络上的控制模型，为理解大脑认知控制功能提供一种可行思路，并利用相关模型提取活动中的有效模式；
    在精神疾病治疗中据此设计更优方案，通过脑刺激干预激活或抑制特定脑区以缓解症状。
    本人负责脑磁共振影像分析，利用深度学习与计算机视觉算法自动识别医学影像中的病灶。
  stack: [MRI 分析, 深度学习, 计算机视觉, 病灶分割]

- period: 2018.04 — 2019.05
  fund: 国家级创新训练项目
  title: 基于大数据分析的协同过滤推荐系统
  role: 负责人 · 算法设计 · 算法实现 · 系统开发
  desc: >-
    以改进的协同过滤推荐算法为核心、用 C# 开发的推荐系统：结合用户爱好特征、历史行为与物品属性，
    为每一位用户提供个性化推荐，达到「投其所好」的效果。
  stack: [协同过滤, 用户画像建模, 大数据分析]

- period: 2017.10 — 2019.12
  fund: 江西省教育厅科学技术研究项目
  title: 基于交叉引力搜索的稀土矿山水污染控制规划
  role: 参与人 · 算法实现 · 数值计算
  desc: >-
    针对离子型稀土矿山水污染特性，设计有效的引力搜索交叉算子与参数自适应性策略，
    再用交叉引力搜索算法综合分析监测水质污染数据，规划出切实可行的水污染控制方案。
  stack: [引力搜索算法, 数值计算, 优化建模]
