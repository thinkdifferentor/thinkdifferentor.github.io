- year: 2018.04
  title: 泰迪杯数据挖掘挑战赛
  award: 一等奖
  rank: Top 5%
  role: 算法设计 · 算法实现 · 论文编写
  detail: >-
    选题为「电视产品的营销推荐」，数据含用户收视信息 561,288 条、电视产品信息 41,876 条、用户基本信息 1,329 条。
    以基于项目的协同过滤算法为核心，建立由用户历史行为到用户评分的打分模型；提出多级项目标签系统，
    并用文本挖掘为项目打标签以支撑精准推荐；建立模糊匹配模型处理文本数据的不一致性问题。

- year: 2017.12
  title: 美国大学生数学建模竞赛（MCM）
  award: 二等奖
  rank: Top 20%
  role: 模型构建 · 算法设计 · 算法实现 · 论文编写
  detail: >-
    选题为美国四个州 1960—2009 年的能源数据分析。提出基于能源类型与流向的能源概况对比分析模型，
    引入能源类型「加权化一」的思想定义能源概况指数；用绝对值聚类分析比较各州能源结构异同；
    对各州不同年份的能源概况指数做回归分析，得到回归方程以预测未来能源结构与供需情况。
