<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" width="1240" height="900" role="img" aria-label="XynA Lab 工作台界面：顶部品牌与操作、实验数据概览四张指标卡、左侧研究对话与示例问题、右侧执行过程与已连接数据表">
  <defs>
