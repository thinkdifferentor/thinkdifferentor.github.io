  <text class="b" x="50" y="140" font-size="27" letter-spacing="-0.4">从实验数据，到研究洞见<tspan fill="#7562d4">.</tspan></text>
  <text class="m" x="50" y="164" font-size="12.5">用自然语言探索木聚糖酶表达实验，每一步分析都有据可循。</text>

