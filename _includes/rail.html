<aside class="rail" aria-label="站点导航">
  <div class="rail-head">
    <a class="brand" href="{{ site.baseurl }}/" aria-label="返回首页">
      <img class="avatar" src="{{ site.baseurl }}/assets/img/avatar.svg" alt="Jun Jiang 的字母标识" width="56" height="56">
      <span class="brand-text">
        <span class="brand-name">{{ site.data.profile.name }}</span>
        <span class="brand-role">{{ site.data.profile.role }}</span>
      </span>
    </a>

    <div class="rail-tools">
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="切换深浅色主题" title="切换主题">
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1Z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/></svg>
      </button>
      <button class="icon-btn" id="print-btn" type="button" aria-label="打印或导出为 PDF" title="打印 / 导出 PDF">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V3.8h10V9"/><rect x="3.5" y="9" width="17" height="7.4" rx="1.6"/><path d="M7 13.6h10v6.6H7z"/></svg>
      </button>
    </div>
  </div>

  <nav class="nav" aria-label="内容锚点">
    <a class="nav-item" href="{{ site.baseurl }}/#education"><span class="nav-num">01</span><span class="nav-zh">教育背景</span><span class="nav-en">EDUCATION</span></a>
    <a class="nav-item" href="{{ site.baseurl }}/#experience"><span class="nav-num">02</span><span class="nav-zh">工作经历</span><span class="nav-en">EXPERIENCE</span></a>
    <a class="nav-item" href="{{ site.baseurl }}/#projects"><span class="nav-num">03</span><span class="nav-zh">项目实践</span><span class="nav-en">PROJECTS</span></a>
    <a class="nav-item" href="{{ site.baseurl }}/#publications"><span class="nav-num">04</span><span class="nav-zh">学术成果</span><span class="nav-en">PUBLICATIONS</span></a>
    <a class="nav-item" href="{{ site.baseurl }}/#patents"><span class="nav-num">05</span><span class="nav-zh">专利软著</span><span class="nav-en">PATENTS</span></a>
    <a class="nav-item" href="{{ site.baseurl }}/#honors"><span class="nav-num">06</span><span class="nav-zh">所获荣誉</span><span class="nav-en">HONORS</span></a>
    <a class="nav-item" href="{{ site.baseurl }}/#skills"><span class="nav-num">07</span><span class="nav-zh">专业技能</span><span class="nav-en">SKILLS</span></a>
    <a class="nav-item" href="{{ site.baseurl }}/#showcase"><span class="nav-num">08</span><span class="nav-zh">项目展示</span><span class="nav-en">SHOWCASE</span></a>
  </nav>

  <div class="rail-foot">
    <ul class="contact">
      <li>
        <button class="contact-item" id="copy-mail" type="button" data-mail="{{ site.data.profile.email }}" data-label="{{ site.data.profile.email }}">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.6" y="5" width="18.8" height="14" rx="2"/><path d="m3.4 6.6 8.6 6.3 8.6-6.3"/></svg>
          <span class="contact-text">{{ site.data.profile.email }}</span>
        </button>
      </li>
      <li>
        <a class="contact-item" href="{{ site.data.profile.github_url }}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 19.2c-4 1.2-4-2-5.6-2.4M15 21v-3.1a2.7 2.7 0 0 0-.7-2.1c2.4-.3 4.9-1.2 4.9-5.3a4.1 4.1 0 0 0-1.1-2.9 3.8 3.8 0 0 0-.1-2.9s-.9-.3-3 1.1a10.3 10.3 0 0 0-5.4 0C5.5 4.4 4.6 4.7 4.6 4.7a3.8 3.8 0 0 0-.1 2.9 4.1 4.1 0 0 0-1.1 2.9c0 4.1 2.5 5 4.9 5.3a2.7 2.7 0 0 0-.7 2.1V21"/></svg>
          <span class="contact-text">github.com/{{ site.data.profile.github }}</span>
        </a>
      </li>
    </ul>
  </div>
</aside>
