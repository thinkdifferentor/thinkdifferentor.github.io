<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  {% include head.html %}
</head>
<body class="{{ page.body_class }}">
  <a class="skip" href="#main">跳到正文</a>
  <div class="shell">
    {% include rail.html %}
    <main class="main" id="main">
      <div class="main-inner">
        {{ content }}
        {% include footer.html %}
      </div>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="图片预览">
    <button class="lightbox-close" type="button" aria-label="关闭预览">ESC</button>
    <img alt="">
  </div>
  <script src="{{ site.baseurl }}/assets/js/main.js" defer></script>
</body>
</html>
